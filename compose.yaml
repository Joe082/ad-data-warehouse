services:

  mysql:
    image: mysql:8.0
    container_name: ad-mysql

    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: ad

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro


  namenode:
    build:
      context: .
      dockerfile: docker/hadoop/Dockerfile
    image: ad-hadoop:3.3.6

    volumes:
      - namenode_data:/data/namenode
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

    command: >
      bash -c "
      if [ ! -d /data/namenode/current ]; then
        hdfs namenode -format -force -nonInteractive;
      fi &&
      hdfs namenode
      "


  datanode:
    image: ad-hadoop:3.3.6
    container_name: ad-datanode

    depends_on:
      - namenode

    ports:
      - "9864:9864"

    volumes:
      - datanode_data:/data/datanode
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml

    command: hdfs datanode

  ad-mock-1:
    build:
      context: ./docker/ad-mock
    container_name: ad-mock-1

    depends_on:
      - mysql

    volumes:
      - ./data/ad-mock/node1:/opt/module/ad_mock/log


  ad-mock-2:
    build:
      context: ./docker/ad-mock
    container_name: ad-mock-2

    depends_on:
      - mysql

    volumes:
      - ./data/ad-mock/node2:/opt/module/ad_mock/log  

  datax:
    build:
      context: docker/datax
      dockerfile: Dockerfile

    image: ad-datax:local
    container_name: ad-datax

    depends_on:
      - mysql
      - namenode

    volumes:
      - ./config/datax/configuration.properties:/opt/gen_datax_config/configuration.properties
      - ./config/datax/jobs:/opt/datax/job/import

    command: ["sleep", "infinity"]

  kafka:
    image: apache/kafka:3.9.1
    container_name: ad-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    volumes:
      - kafka_data:/var/lib/kafka/data

  flume-producer:
    build:
      context: .
      dockerfile: docker/flume/Dockerfile
    image: ad-flume:1.11.0

    container_name: ad-flume-producer

    depends_on:
      - kafka

    volumes:
      - ./config/flume/ad_file_to_kafka.conf:/opt/flume/job/ad_file_to_kafka.conf:ro
      - ./data/ad-mock:/logs:ro
      - ./data/flume/position:/flume-data

    command:
      - /opt/flume/bin/flume-ng
      - agent
      - -n
      - a1
      - -c
      - /opt/flume/conf
      - -f
      - /opt/flume/job/ad_file_to_kafka.conf
      - -Dflume.root.logger=INFO,console

  flume-consumer:
    image: ad-flume:1.11.0

    container_name: ad-flume-consumer

    depends_on:
      - kafka
      - namenode

    environment:
      JAVA_OPTS: "-Xms256m -Xmx512m"

    volumes:
      - ./config/flume/ad_kafka_to_hdfs.conf:/opt/flume/job/ad_kafka_to_hdfs.conf:ro
      - ./config/flume/flume-env.sh:/opt/flume/conf/flume-env.sh:ro
      - ./data/flume/consumer:/flume-data

    command:
      - /opt/flume/bin/flume-ng
      - agent
      - -n
      - a1
      - -c
      - /opt/flume/conf
      - -f
      - /opt/flume/job/ad_kafka_to_hdfs.conf
      - -Dflume.root.logger=INFO,console


  hive-metastore:
    build:
      context: .
      dockerfile: docker/hive/Dockerfile

    container_name: ad-hive-metastore

    depends_on:
      - mysql
      - namenode

    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: mysql

    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro

    ports:
      - "9083:9083"

  hiveserver2:
    build:
      context: .
      dockerfile: docker/hive/Dockerfile

    container_name: ad-hiveserver2

    depends_on:
      - hive-metastore
      - namenode

    environment:
      SERVICE_NAME: hiveserver2
      SKIP_SCHEMA_INIT: "true"

    volumes:
      - ./config/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./config/hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./config/hadoop/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./udf:/opt/ad/udf:ro

    ports:
      - "10000:10000"
      - "10002:10002"
    

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ad-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: "000000"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - default

  spark:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: ad-spark:3.3.1
    container_name: ad-spark
    hostname: ad-spark
    command: ["sleep", "infinity"]


  dolphinscheduler:
    image: ad-dolphinscheduler:3.2.2
    container_name: ad-dolphinscheduler

    depends_on:
      - mysql

    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/dolphinscheduler?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mysql

    ports:
      - "12345:12345"

    volumes:
      - dolphinscheduler_data:/opt/dolphinscheduler/data
      - ./scripts:/opt/ad/scripts
      - ./sql:/opt/ad/sql
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock

volumes:
  mysql_data:
  namenode_data:
  datanode_data:
  kafka_data:
  clickhouse_data:
  dolphinscheduler_data: